#!/bin/sh
# chezmoi modify_ script for ~/.codex/config.toml
# Managed sections are overwritten; local and desktop-app-owned tables are preserved from existing file.

existing=$(cat)

# --- Managed base config ---
base=$(cat << 'EOF'
model = "gpt-6.1-sol"
personality = "pragmatic"
model_reasoning_effort = "medium"
sandbox_mode = "workspace-write"

[sandbox_workspace_write]
exclude_slash_tmp = true
exclude_tmpdir_env_var = true

[shell_environment_policy]
experimental_use_profile = true

[mcp_servers.awslabs-aws-documentation-mcp-server]
command = "uvx"
args = ["awslabs.aws-documentation-mcp-server@latest"]

[mcp_servers.awslabs-aws-documentation-mcp-server.env]
FASTMCP_LOG_LEVEL = "ERROR"

[mcp_servers.grafana]
command = "mcp-grafana"
env_vars = ["GRAFANA_URL", "GRAFANA_SERVICE_ACCOUNT_TOKEN"]

[mcp_servers.mintlify-index]
url = "https://index.mintlify.com/mcp"

[mcp_servers.playwright-mcp]
command = "playwright-mcp"
args = ["--headless"]

[mcp_servers.rails-mcp-server]
command = "rails-mcp-server"

[mcp_servers.serena]
command = "uvx"
args = ["--from", "git+https://github.com/oraios/serena", "serena", "start-mcp-server", "--enable-web-dashboard", "false"]

[plugins."github@openai-curated"]
enabled = true

[features]
hooks = true

[tui]
status_line = ["model-with-reasoning", "thread-title", "current-dir", "git-branch", "context-used", "five-hour-limit", "weekly-limit"]
terminal_title = ["activity", "project-name", "thread-title"]
EOF
)

printf '%s\n' "$base"

# [tui] is the last managed table, so a preserved key can be appended right after it.
printf '%s' "$existing" | awk '
  /^\[/ { in_tui = ($0 == "[tui]") }
  in_tui && /^screen_reader_detection_done[[:space:]]*=/ { print }
'

# --- Preserve local and desktop-app-owned tables from existing file ---
# Tables already defined in the managed base are skipped to avoid duplicates.
preserved=$(
  printf '%s' "$existing" | MANAGED_HEADERS=$(printf '%s\n' "$base" | grep '^\[') awk '
    BEGIN {
      n = split(ENVIRON["MANAGED_HEADERS"], headers, "\n")
      for (i = 1; i <= n; i++) managed[headers[i]] = 1
    }
    /^\[/ {
      keep = !($0 in managed) &&
        ($0 ~ /^\[projects\./ ||
         $0 ~ /^\[tui\.model_availability_nux\]/ ||
         $0 ~ /^\[hooks\.state(\]|\.)/ ||
         $0 ~ /^\[mcp_servers\.node_repl(\]|\.)/ ||
         $0 ~ /^\[plugins\./ ||
         $0 ~ /^\[marketplaces\./ ||
         $0 ~ /^\[desktop(\]|\.)/)
    }
    keep { print }
  '
)

if [ -n "$preserved" ]; then
  printf '\n'
  printf '%s\n' "$preserved"
fi
