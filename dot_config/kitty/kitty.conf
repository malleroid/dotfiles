# Kitty terminal configuration
# ~/.config/kitty/kitty.conf
#
# Role: sub terminal for kitty-graphics tools (terminal-browser) and
# fallback when Ghostty + zellij is unavailable. Runs WITHOUT zellij
# so the kitty graphics protocol works natively.

# --- Theme ---
include emerald-synth.conf

# --- Appearance ---
background_opacity 0.80
mouse_hide_wait -1

# --- Font ---
font_family HackGen35 Console NF
font_size 14.0

# --- Window ---
hide_window_decorations titlebar-only
confirm_os_window_close -1

# --- Scrollback ---
# No zellij here, so kitty owns the scrollback (Ghostty delegates to zellij)
scrollback_lines 100000

# --- macOS ---
macos_option_as_alt yes

# --- Clipboard ---
copy_on_select clipboard

# --- Keybindings ---
# Keep kitty defaults (tabs/layouts replace zellij in this terminal).
# Newline in Claude Code and other REPLs
map shift+enter send_text all \x1b\r
