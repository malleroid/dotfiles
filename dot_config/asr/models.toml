# ASR models used by mlx-transcribe, qwen-transcribe and haas-transcribe.
# Resolved by the asr-model fish function; see docs/asr-models.md.
#
# Each engine table holds `default` and one sub-table per model:
#   source   hf:<repo>              Hugging Face repo, pinned by `revision` (commit sha)
#            local:<path>           artifact built locally, described by `from` and `build`
#            speech:<name>[:<type>] speech.cpp catalog entry, pinned by the speech.cpp version in mise
#   aliases  other names accepted by -m

[mlx-whisper]
