# Skills maintained upstream. chezmoi fetches them, so the repo declares the pinned
# version instead of vendoring the contents.
#
# Pin to a commit SHA, never a moving ref: with a branch tarball the skill contents can
# change without leaving a trace in this repo's history. Updating is a deliberate one-line
# edit. refreshPeriod is omitted on purpose — a SHA tarball is immutable, so the default
# (cache forever) is correct.

# github/gh-stack ships its agent skill in-repo. Pinned to main rather than the v0.1.0 tag
# because the tag predates the split into references/.
[".agents/skills/gh-stack"]
    type = "archive"
    url = "https://github.com/github/gh-stack/archive/bd0a32504f9ae9f795875a9e6bb90ff7408fda08.tar.gz"
    stripComponents = 3
    include = ["*/skills/gh-stack/**"]

# modem-dev/hunk bundles its agent skill in the npm package. Pinned to the commit of the
# release tag noted after the URL, kept in lockstep with npm:hunkdiff in mise.
[".agents/skills/hunk-review"]
    type = "archive"
    url = "https://github.com/modem-dev/hunk/archive/39c03a86d355b0e7b308ea8fa0f211274fb55468.tar.gz" # v0.25.0
    stripComponents = 5
    include = ["*/packages/hunk/skills/hunk-review/**"]

# docker/skills: only the Dockerfile, Compose, and destructive-command guardrail skills.
# Installing it as a plugin would pull in all skills and register the remote docker-docs
# MCP server. All four entries share one URL, so chezmoi downloads the archive once.
[".agents/skills/docker-project-foundations"]
    type = "archive"
    url = "https://github.com/docker/skills/archive/8afc2c6ef4e0ec2ea8e4ba024d0b884ea930b926.tar.gz" # v0.3.1
    stripComponents = 3
    include = ["*/skills/docker-project-foundations/**"]

[".agents/skills/docker-build-strategies"]
    type = "archive"
    url = "https://github.com/docker/skills/archive/8afc2c6ef4e0ec2ea8e4ba024d0b884ea930b926.tar.gz" # v0.3.1
    stripComponents = 3
    include = ["*/skills/docker-build-strategies/**"]

[".agents/skills/docker-compose-patterns"]
    type = "archive"
    url = "https://github.com/docker/skills/archive/8afc2c6ef4e0ec2ea8e4ba024d0b884ea930b926.tar.gz" # v0.3.1
    stripComponents = 3
    include = ["*/skills/docker-compose-patterns/**"]

[".agents/skills/docker-destructive-guardrails"]
    type = "archive"
    url = "https://github.com/docker/skills/archive/8afc2c6ef4e0ec2ea8e4ba024d0b884ea930b926.tar.gz" # v0.3.1
    stripComponents = 3
    include = ["*/skills/docker-destructive-guardrails/**"]
