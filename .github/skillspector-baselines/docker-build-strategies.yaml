# Reviewed false positives for .agents/skills/docker-build-strategies.
# `message` must fully match the finding's matched text, so keep each pattern anchored.
version: 2
rules:
  - id: "PE3"
    message: "*.npmrc"
    reason: "Docs tell readers not to COPY .npmrc and mount it as a BuildKit secret instead"
  - id: "PE3"
    message: "*.netrc"
    reason: "Listed among credential files that must not be copied into the build context"
  - id: "PE3"
    message: "*.aws/credentials"
    reason: "Listed among credential files that must not be copied into the build context"
  - id: "PE3"
    message: "*.azure/"
    reason: "Listed among credential files that must not be copied into the build context"
  - id: "PE3"
    message: "~/.config/gcloud/"
    reason: "Listed among credential files that must not be copied into the build context"
  - id: "PE3"
    message: "kubeconfig"
    reason: "Listed among credential files that must not be copied into the build context"
  - id: "PE3"
    message: "/.ssh/known_hosts"
    reason: "Populating known_hosts inside an SSH-mounted RUN, as the safe alternative to StrictHostKeyChecking=no"
  - id: "PE3"
    path: "assets/dockerignore-example"
    message: ".env*"
    reason: ".env is listed in the example .dockerignore to keep it out of the build context"
  - id: "PE3"
    path: "SKILL.md"
    message: "Access the secret"
    reason: "Explains reading /run/secrets/<id> instead of echoing the secret into a layer"
  - id: "RA2"
    path: "SKILL.md"
    message: "write the manifest back into the image*"
    reason: "Layer-caching advice about bind-mounting manifests, not session persistence"
  - id: "RA2"
    path: "references/multi-stage-builds.md"
    message: "write them. The full source*"
    reason: "Multi-stage build explanation, not session persistence"
  - id: "RP1"
    path: "checks/verification.md"
    reason: "Verification checklist item that asserts images are pinned"
  - id: "TM1"
    path: "SKILL.md"
    message: "rm -rf /*"
    reason: "Matches the standard apt list cleanup, cited as unnecessary with cache mounts"
  - id: "TM1"
    path: "references/layer-caching.md"
    message: "rm -rf /*"
    reason: "Matches the standard apt list cleanup in the layer-caching reference"
