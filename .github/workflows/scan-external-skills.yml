name: Scan external skills

on:
  pull_request:
    paths:
      - .chezmoiexternal.toml
      - .github/scripts/scan-external-skills.py
      - .github/skillspector-baselines/**
      - .github/workflows/scan-external-skills.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install SkillSpector
        run: |
          uv tool install "git+https://github.com/NVIDIA/SkillSpector.git@54824463814a0be01360792523ec7245a69190fc" # v2.13.4
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Scan
        run: uv run .github/scripts/scan-external-skills.py
