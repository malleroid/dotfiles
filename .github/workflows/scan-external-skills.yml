name: Scan external skills

on:
  pull_request:
    paths:
      - .chezmoiexternal.toml
      - .github/scripts/scan-external-skills.py
      - .github/skillspector-baselines/**
      - .github/workflows/scan-external-skills.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@1db35dd8eee11c5894872e0b383ae6c406cf738d # v10.4.0
        with:
          enable-cache: false

      - name: Install SkillSpector
        run: |
          uv tool install "git+https://github.com/NVIDIA/SkillSpector.git@e2674da339b0bddc6e565d059c0577c6d9cd25da" # v2.13.6
          uv tool dir --bin >> "$GITHUB_PATH"

      - name: Scan
        run: uv run .github/scripts/scan-external-skills.py
